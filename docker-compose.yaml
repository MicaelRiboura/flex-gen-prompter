services:
  web:
    build: .
    container_name: flexgenprompter_web
    command: bash -c "uv run manage.py migrate && uv run manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env  # opcional, para variáveis de ambiente do projeto
    stdin_open: true
    tty: true

  redis:
    image: redis:latest
    container_name: flexgenprompter_redis
    ports:
      - "6379:6379"

  worker:
    build: .
    container_name: flexgenprompter_worker
    command: uv run celery -A flexgenprompter.celery worker -l info -P gevent
    volumes:
      - .:/app
    depends_on:
      - web
      - redis
    env_file:
      - .env  # opcional
    stdin_open: true
    tty: true