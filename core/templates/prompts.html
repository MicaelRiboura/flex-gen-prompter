{% extends 'base/base.html'%}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/datasets.css' %}">
</link>

<script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

<script type="importmap">
    {
    "imports": {
        "style-mod": "https://esm.sh/style-mod",
        "w3c-keyname": "https://esm.sh/w3c-keyname",
        "crelt": "https://esm.sh/crelt",
        "@marijn/find-cluster-break": "https://esm.sh/@marijn/find-cluster-break",
        "@lezer/": "https://esm.sh/*@lezer/",
        "@codemirror/": "https://esm.sh/*@codemirror/",
        "codemirror": "https://esm.sh/*codemirror",
        "@codemirror/lint": "https://unpkg.com/@codemirror/lint@6.8.0/dist/index.js"
    }
    }
</script>
{% endblock %}

{% block content %}
<div class="p-8">
    <h1 class="text-3xl font-bold mb-6">Prompts</h1>
    <div class="bg-white rounded-lg p-6 mb-6 flex flex-wrap space-x-4">
        <div class="w-1/3">
            <label class="block text-sm/6 font-medium">Técnica</label>
            <select id="technique-select" class="w-full rounded-md p-2 border-1 border-gray-300 text-gray-900 focus:outline-none" id="">
                <option value=""></option>
                {% for technique in techniques %}
                    <option value="{{ technique }}">{{ technique }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="w-1/3">
            <label class="block text-sm/6 font-medium">Dataset</label>
            <select id="dataset-select" class="w-full rounded-md p-2 border-1 border-gray-300 text-gray-900 focus:outline-none" id="">
                <option value=""></option>
                {% for dataset in datasets %}
                <option value="{{ dataset }}">{{ dataset }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="w-full py-4">
            <button id="load-prompts-btn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 cursor-pointer">Carregar Prompts</button>
        </div>
        
    </div>
    <div class="bg-white shadow-md rounded-lg p-6">
        <h2 class="text-2xl font-semibold mb-4">Prompts</h2>
        <div id="prompts-container" class="relative overflow-x-auto">
            <h5 class="mb-4 font-normal text-gray-900 text-lg">Modifique os prompts da técnica e dataset escolhidos</h5>
        </div>
    </div>

</div>


<script type="module" src="{% static 'js/prompts.js' %}"></script>

{% endblock %}
